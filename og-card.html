<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Awake? OG card</title>
<style>
  /* The app's own bundled faces, so the render needs no network and matches
     the product exactly. Bricolage is variable, so the axes are pinned. */
  @font-face{
    font-family:'Bricolage';
    src:url('og-fonts/BricolageGrotesque-Variable.ttf') format('truetype-variations');
    font-weight:200 800;
  }
  @font-face{ font-family:'Plex'; src:url('og-fonts/IBMPlexMono-Regular.ttf'); font-weight:400 }
  @font-face{ font-family:'Plex'; src:url('og-fonts/IBMPlexMono-Medium.ttf'); font-weight:500 }

  :root{
    --cream:#FBF6EC; --ink:#201B15; --yellow:#F4D648; --accent:#3AA3C4;
    --dim:#4A453C; --faint:#8A8375;
    --p-bg:#191510; --p-line:#2D2D2D; --p-text:#EAE5D7;
    --p-second:#AEA691; --p-muted:#756C5B;
    --disp:'Bricolage',sans-serif; --mono:'Plex',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:
      radial-gradient(90% 70% at 78% 10%, rgba(58,163,196,.10), rgba(58,163,196,0) 60%),
      radial-gradient(80% 80% at 6% 96%, rgba(244,214,72,.16), rgba(244,214,72,0) 62%),
      var(--cream);
    font-family:var(--disp);color:var(--ink);position:relative
  }

  .wrap{display:flex;height:100%;align-items:stretch}

  /* ---- left column ---- */
  .left{width:640px;padding:54px 0 50px 62px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:13px;font-weight:800;font-size:34px;letter-spacing:-.6px}
  .eyebrow{font-family:var(--mono);font-weight:400;font-size:15px;letter-spacing:2.4px;
    text-transform:uppercase;color:#2C7E99;margin:0 0 20px}
  h1{font-weight:800;font-size:65px;line-height:1.05;letter-spacing:-.025em}
  .hl{position:relative;display:inline-block;white-space:nowrap}
  .hl span{position:relative;z-index:1;padding:0 .1em}
  .hl i{position:absolute;inset:9% -2% 6%;background:var(--yellow);
    transform:rotate(-1.8deg);border-radius:7px;z-index:0}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-weight:400;font-size:14px;letter-spacing:1px;
    text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:8px 15px;
    box-shadow:2px 2px 0 var(--ink)}
  .chip.solid{background:var(--ink);color:var(--cream);box-shadow:2px 2px 0 var(--accent)}

  /* ---- right column: the panel, hung the way a popover hangs ---- */
  .right{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding-right:34px}
  .panel{
    width:372px;background:var(--p-bg);color:var(--p-text);
    border:1px solid var(--p-line);border-radius:15px;
    padding:15px 0 14px;transform:rotate(-2deg);
    box-shadow:0 30px 70px rgba(32,27,21,.32),0 4px 14px rgba(32,27,21,.22)
  }
  .pad{padding-left:17px;padding-right:17px}
  .head{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:12px;text-transform:uppercase;color:var(--p-muted)}
  .head b{color:var(--yellow);text-transform:none;font-weight:400;font-size:12.5px}
  .row{position:relative;display:grid;grid-template-columns:1fr auto;
    column-gap:12px;row-gap:3px;padding:10px 17px;align-items:baseline}
  .band{position:absolute;left:17px;top:2px;bottom:2px;border-radius:5px;opacity:.13}
  .nm{font-weight:500;font-size:15.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:9px;position:relative}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .tm{font-family:var(--mono);font-size:15.5px;text-align:right;white-space:nowrap;position:relative}
  .dl{color:var(--yellow);font-size:11px;margin-left:5px}
  .cy{grid-column:1;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;
    color:var(--p-second);padding-left:17px;position:relative}
  .st{grid-column:2;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;
    text-align:right;color:var(--p-muted);position:relative}
  .track{position:relative;height:24px;margin:11px 17px 0;border-radius:6px;
    background:#221D17;border:1px solid var(--p-line)}
  .nowm{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--p-muted);left:50%}
  .hand{position:absolute;top:-5px;bottom:-5px;width:12px;margin-left:-6px;border-radius:6px;
    background:var(--cream);border:1px solid #000;box-shadow:0 2px 6px rgba(0,0,0,.5);left:79%}
  .ticks{position:relative;height:15px;margin:7px 17px 0;font-family:var(--mono);font-size:10px;color:var(--p-muted)}
  .ticks span{position:absolute;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">

  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 100 100" width="52" height="52">
        <rect x="10" y="10" width="80" height="80" rx="22" fill="#201B15"/>
        <circle cx="57.5" cy="30.5" r="7.5" fill="#F4D648"/>
        <rect x="21.5" y="36.5" width="57" height="42" rx="5.5" fill="#F5F2E9"/>
        <circle cx="32" cy="43.5" r="3.2" fill="#E06E49"/><rect x="38.5" y="41.6" width="25.5" height="3.8" rx="1.9" fill="#D6CFBD"/>
        <circle cx="32" cy="57.5" r="3.2" fill="#61ADBF"/><rect x="38.5" y="55.6" width="20.5" height="3.8" rx="1.9" fill="#D6CFBD"/>
        <circle cx="32" cy="71.5" r="3.2" fill="#69BC75"/><rect x="38.5" y="69.6" width="23" height="3.8" rx="1.9" fill="#D6CFBD"/>
      </svg>
      Awake?
    </div>

    <div>
      <p class="eyebrow">A menu bar app for macOS</p>
      <h1>They said<br><span class="hl"><span>4pm EST.</span><i></i></span><br>Now see it land.</h1>
    </div>

    <div class="chips">
      <span class="chip solid">Free</span>
      <span class="chip">Zero network requests</span>
      <span class="chip">34,080 cities</span>
    </div>
  </div>

  <div class="right">
    <div class="panel">
      <div class="pad head"><span>4 people</span><b>showing 4:00 PM EST</b></div>

      <div class="row" style="margin-top:9px">
        <div class="band" style="background:#E06E49;width:31%"></div>
        <div class="nm"><span class="dot" style="background:#E06E49"></span>Ahmed</div>
        <div class="tm">1:00 AM<span class="dl">+1d</span></div>
        <div class="cy">Dubai</div><div class="st">off, back in 8h</div>
      </div>

      <div class="row">
        <div class="band" style="background:#61ADBF;width:44%;left:23%"></div>
        <div class="nm"><span class="dot" style="background:#61ADBF"></span>Lena</div>
        <div class="tm">10:00 PM</div>
        <div class="cy">Berlin</div><div class="st">off, back in 11h</div>
      </div>

      <div class="row">
        <div class="band" style="background:#69BC75;width:35%;left:47%"></div>
        <div class="nm"><span class="dot" style="background:#69BC75"></span>Marcus</div>
        <div class="tm">4:00 PM</div>
        <div class="cy">New York</div><div class="st">around</div>
      </div>

      <div class="row">
        <div class="nm"><span class="dot" style="background:#C56DCF"></span>Yuki</div>
        <div class="tm">6:00 AM<span class="dl">+1d</span></div>
        <div class="cy">Tokyo</div><div class="st"></div>
      </div>

      <div class="track"><div class="nowm"></div><div class="hand"></div></div>
      <div class="ticks">
        <span style="left:6%">12pm</span><span style="left:31%">6pm</span>
        <span style="left:56%">12am</span><span style="left:81%">6am</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
